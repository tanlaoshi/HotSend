# HotSend 默认配置（CLI 无参 / Gui 预填共用）
# 查找：$HOTSEND_CONFIG → ./hotsend.conf → ~/.config/hotsend/hotsend.conf → ~/HotSend/hotsend.conf
# 命令行参数覆盖本文件。

transport=serial
port=/dev/ttyUSB0
baud=115200
host=192.168.31.47
tcp-port=26992

file=~/Blocks/Kernel/Build/HAL/X64/Kernel.elf
path=D:Kernel.elf
no-reboot=1
no-backup=0
dry-run=0
steady-throttle=0
pace-ms=0
